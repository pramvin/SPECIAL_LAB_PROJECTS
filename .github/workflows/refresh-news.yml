name: Refresh news

# Every 2 hours: fetch Yahoo Finance headlines for the current ideas, score them, write to Neon.
# Needs the repo secret DATABASE_URL (Neon connection string). Prices are not refreshed here.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pipeline.news
      - run: python -m pipeline.sentiment
